# Docker Compose для Finance App
version: '3.8'

services:
  # PostgreSQL база данных
  db:
    image: postgres:15-alpine
    container_name: finance_app
    environment:
      POSTGRES_USER: finance_user
      POSTGRES_PASSWORD: 1029384756Aa
      POSTGRES_DB: finance_app
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"  # Внешний порт 5433 (чтобы не конфликтовать с локальным PostgreSQL)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance_user -d finance_app"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finance_backend
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG:-false}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/logs:/app/logs
      - ./backend/app/ml/trained_models:/app/app/ml/trained_models:ro
    restart: unless-stopped

  # Frontend (production build served by nginx)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: finance_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
