server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1000;

    # SPA routing - все запросы направляем на index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Проксирование API запросов на backend
    location /api {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Кэширование статики
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    http {
        # Зона для ограничения запросов (10MB памяти, 10 req/sec)
        limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
        limit_req_zone $binary_remote_addr zone=auth:10m rate=3r/m;

        server {
            listen 80;

            # Общее ограничение для API
            location /api/ {
                limit_req zone=api burst=20 nodelay;
                limit_req_status 429;
                proxy_pass http://backend:8000;
            }

            # Жёсткое ограничение для авторизации
            location /api/v1/auth/ {
                limit_req zone=auth burst=5 nodelay;
                limit_req_status 429;
                proxy_pass http://backend:8000;
            }
        }
    }
}
